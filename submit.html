<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Submit Complaint</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="brand">
    <img src="img/sau-logo.jpg" alt="SAU Logo" class="logo">
    <div>
      <div class="uni">Sindh Agriculture University, Tandojam</div>
      <div class="fac">Faculty of Information Technology — Complaint Portal</div>
    </div>
  </div>
  <nav>
    <a href="index.html">Home</a>
    <a href="track.html">Track</a>
    <a href="login.html">Admin Login</a>
  </nav>
</header>

<div class="container">
  <div class="card">
    <h2>Submit a Complaint</h2>
    <form id="complaintForm">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="e.g. Amara Rajput" required>

      <label>Registration No.</label>
      <input type="text" id="reg" placeholder="e.g. 2k23-SE-67" required>

      <label>Department</label>
      <select id="dept">
        <option>Computer Science (CS)</option>
        <option>Software Engineering (SE)</option>
        <option>Information Technology (IT)</option>
      </select>

      <label>Category</label>
      <select id="category">
        <option>Lab Equipment</option>
        <option>Internet / Wi-Fi</option>
        <option>Lectures &amp; Classes</option>
        <option>Faculty</option>
        <option>Transport</option>
        <option>Hostel</option>
        <option>Other</option>
      </select>

      <label>Description</label>
      <textarea id="desc" placeholder="Describe your complaint in detail..." required></textarea>

      <br><br>
      <button class="btn" type="submit">Submit Complaint</button>
    </form>
    <div id="result" style="margin-top:16px; font-size:16px; color:#14532d;"></div>
  </div>
</div>

<footer>© 2026 Faculty of Information Technology, Sindh Agriculture University Tandojam</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
</body>
</html>
