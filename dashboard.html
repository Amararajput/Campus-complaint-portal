<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="brand">
    <img src="img/sau-logo.jpg" alt="SAU Logo" class="logo">
    <div>
      <div class="uni">Sindh Agriculture University, Tandojam</div>
      <div class="fac">Faculty of IT — Admin Dashboard</div>
    </div>
  </div>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="#" id="logoutBtn">Logout</a>
  </nav>
</header>

<div class="container">
  <div class="stats">
    <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">Total</div></div>
    <div class="stat"><div class="num" id="statPending">0</div><div class="lbl">Pending</div></div>
    <div class="stat"><div class="num" id="statProgress">0</div><div class="lbl">In Progress</div></div>
    <div class="stat"><div class="num" id="statResolved">0</div><div class="lbl">Resolved</div></div>
  </div>

  <div class="card">
    <h2>All Complaints</h2>
    <table>
      <thead>
        <tr><th>ID</th><th>Student</th><th>Dept</th><th>Category</th><th>Status</th><th>Action</th></tr>
      </thead>
      <tbody id="complaintsBody">
        <tr><td colspan="6">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<footer>© 2026 Faculty of Information Technology, Sindh Agriculture University Tandojam</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
</body>
</html>
