<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="brand">
    <img src="img/sau-logo.jpg" alt="SAU Logo" class="logo">
    <div>
      <div class="uni">Sindh Agriculture University, Tandojam</div>
      <div class="fac">Faculty of Information Technology — Complaint Portal</div>
    </div>
  </div>
  <nav>
    <a href="index.html">Home</a>
    <a href="track.html">Track</a>
    <a href="login.html">Admin Login</a>
  </nav>
</header>

<div class="container">
  <div class="card" style="max-width:400px; margin: 0 auto;">
    <h2>Admin Login</h2>
    <form id="adminLoginForm">
      <label>Admin Email</label>
      <input type="email" id="adminEmail" placeholder="admin@sau.edu.pk" required>
      <label>Password</label>
      <input type="password" id="adminPassword" placeholder="••••••" required>
      <br><br>
      <button class="btn" type="submit" style="width:100%">Login</button>
    </form>
    <div id="loginError" style="margin-top:12px; color:#b91c1c;"></div>
    <p style="color:#777; font-size:14px; margin-top:12px;">Admin account is created in Supabase Dashboard &gt; Authentication &gt; Users &gt; Add user.</p>
  </div>
</div>

<footer>© 2026 Faculty of Information Technology, Sindh Agriculture University Tandojam</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
</body>
</html>
